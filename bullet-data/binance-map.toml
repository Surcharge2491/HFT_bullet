# Bullet market -> the Binance USD-M perp that tracks it, for fetch-binance and
# for the fair price. Checked 2026-11-10 by comparing prices (Bullet now vs
# Binance's last 2026-11-08 trade; same asset = within a few percent).
#
# kind = "same"  : the same asset (fair price = Binance price + learned gap)
# kind = "scaled": an ETF tracking the index at a different price level. The
#                  bot adds a fixed gap rather than scaling, so it can't quote
#                  these yet; recorded for research only.
# Left out: SPXUSDT is the SPX6900 memecoin, not the S&P 500.

[markets]
